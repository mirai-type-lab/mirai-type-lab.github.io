<body>
<div class="wrap">
<h1>年末の手続きカレンダー 2026</h1>
<p class="sub">「いつまでに何をする？」を公式の日付だけで1ページに。済んだらチェック。</p>

<h3>ここに書いていないこと</h3>
<p class="note">税金の損得や、いくら寄附すればいいかの計算はここではしません。控除の上限は収入や家族の状況で変わるので、ふるさと納税ポータル（総務省）や勤め先・税務署で確かめてください。日付は変わることがあるので、手続きの前に必ずそれぞれの公式ページを見てください。</p>

<script>
var ITEMS=[
{id:"nenga-start",d:"2026-12-20",t:"年賀状の受付が始まる",b:"郵便ポストや郵便局で年賀状として受け付けるのは12月20日（日）から。19日以前に出すと、ふつうの郵便として年内に届いてしまうので注意。去年までの12月15日から変わりました。",s:[["日本郵便「2027年用年賀はがき等の発行概要」（2026年8月31日）","https://files.japanpost.jp/assets/34d9d11432734cfaa759e78fe395b688/159168aef19d465baf3350d358e46fa9/20260831_02_06.pdf"]]},
{id:"nenga-end",d:"2026-12-27",t:"年賀状を元日に届けたいなら、ここまでに出す",b:"日本郵便は、元日に届けるため12月27日（日）までに出すようお願いしています（去年までは25日）。三が日の配達は元日と1月3日。年賀はがきの販売は1月15日まで。",s:[["日本郵便「2027年用年賀はがき等の発行概要」（2026年8月31日）","https://files.japanpost.jp/assets/34d9d11432734cfaa759e78fe395b688/159168aef19d465baf3350d358e46fa9/20260831_02_06.pdf"]]},
{id:"furusato",d:"2026-12-31",t:"ふるさと納税：今年の分は12月31日までの寄附",b:"ふるさと納税の控除は1月1日〜12月31日の寄附が1年分。年末は支払いの手続きや受付が混むので、自治体ごとの受付の締切（12月31日より早いこともある）を先に見ておこう。",s:[["総務省 ふるさと納税ポータル「ふるさと納税の概要」","https://www.soumu.go.jp/main_sosiki/jichi_zeisei/czaisei/czaisei_seido/furusato/mechanism/about.html"]]},
{id:"onestop",d:"2027-01-10",t:"ワンストップ特例の申請書は1月10日必着",b:"確定申告をしない会社員などで、寄附先が5自治体以内なら「ワンストップ特例」が使える。申請書は寄附した自治体ごとに、翌年1月10日までに届くように出す。間に合わなければ確定申告で手続きする。",s:[["新潟県「ふるさと納税ワンストップ特例制度」","https://www.pref.niigata.lg.jp/sec/chiikiseisaku/onestop.html"]]},
{id:"nencho",d:"",t:"年末調整の書類を勤め先に出す",b:"会社員・パートなどは、扶養控除・保険料控除などの申告書を勤め先に出す。締切は勤め先が決めるので、社内のお知らせを確かめよう。生命保険などの控除証明書は手元にそろえておく。",s:[["国税庁「年末調整がよくわかるページ」","https://www.nta.go.jp/users/gensen/nencho/index.htm"]]},
{id:"gomi",d:"",t:"年末年始のごみの日を確かめる",b:"大掃除のごみや粗大ごみは、年末年始の収集日程が市区町村ごとに変わる。早めに自分の市区町村の年末年始の収集日を確かめておこう。",s:[]}
];
function jst(){var n=new Date(Date.now()+9*3600e3);return new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()));}
var T=jst(),W="日月火水木金土";
document.getElementById("today").textContent="今日は "+(T.getUTCMonth()+1)+"月"+T.getUTCDate()+"日（"+W[T.getUTCDay()]+"）";
var done={};try{done=JSON.parse(localStorage.getItem("nenmatsu-done")||"{}")}catch(e){}
function save(){try{localStorage.setItem("nenmatsu-done",JSON.stringify(done))}catch(e){}}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
 var h="";ITEMS.forEach(function(it){
  var w="期限は勤め先・お住まいの市区町村で確認",cls="";
  if(it.d){var p=it.d.split("-"),D=new Date(Date.UTC(+p[0],p[1]-1,+p[2])),k=Math.round((D-T)/864e5);
   var lab=k>0?"あと"+k+"日":k===0?"今日まで":"過ぎました";cls=k<0?"past":k<=7?"soon":"";
   w=(+p[1])+"月"+(+p[2])+"日（"+W[D.getUTCDay()]+"）<span class=\"left "+cls+"\">"+lab+"</span>";}
  h+='<label class="item'+(done[it.id]?" done":"")+'"><input type="checkbox" data-id="'+it.id+'"'+(done[it.id]?" checked":"")+'><div><div class="when">'+w+'</div><h2>'+esc(it.t)+'</h2><p>'+esc(it.b)+'</p>'+(it.s.length?'<div class="src">出どころ：'+it.s.map(function(s){return'<a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[0])+'</a>'}).join(" ／ ")+'</div>':"")+'</div></label>';
 });
 document.getElementById("list").innerHTML=h;
 Array.prototype.forEach.call(document.querySelectorAll("#list input"),function(c){c.onchange=function(){done[c.dataset.id]=c.checked;save();render();try{gtag("event","nenmatsu_check",{item:c.dataset.id,on:c.checked})}catch(e){}}});
}
render();
</script>
