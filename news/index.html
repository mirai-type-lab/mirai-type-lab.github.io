.date{font-size:12px;color:#8A7A6A;margin-left:8px}

<body>
<div class="wrap">

<h1>ネタぴよニュース</h1>
<p class="lead">毎日の気になるニュースを、やさしく1分で。<br>記事ごとに「はい・いいえ」で答えると、あなたが今やることがわかるよ。</p>

<div class="card cta">

<script>
// ニュースの中身。足す時はこの並びに1件ずつ足す（出どころは必ず確かめた記事か公的な発表）。
// 問いの形：q（問い） yes/no（次の問いの番号 か "a:答えの番号"）
var NEWS = [
 {
  id:"shurijo", tag:"今日のネタ", date:"2026年11月23日",
  title:"首里城の正殿、11月23日から一般公開",
  sum:"2019年10月の火事で焼けてから約7年。復元された首里城の正殿の中が、11月23日から一般公開。正殿を見るには事前予約が要るようになり、入場料も大人400円から1000円に変わった。",
  src:[["琉球新報","https://ryukyushimpo.jp/national/entry-5550312.html"],["トラベル Watch","https://travel.watch.impress.co.jp/docs/news/2133105.html"],["タイムアウト東京","https://www.timeout.jp/tokyo/ja/news/shuri-castle-reopen-102126"]],
  qs:[
   {q:"近いうちに沖縄へ行く予定ある？", yes:1, no:2},
   {q:"正殿の中も見たい？", yes:"a:0", no:"a:1"},
   {q:"いつか行ってみたい？", yes:"a:2", no:"a:3"}
  ],
  as:[
   {t:"行く日を決めたら、先に予約！", b:"正殿の中を見るには事前予約が要るよ。行く日が決まったら、首里城公園のホームページの「正殿内観覧予約」から予約しておこう（10人未満の場合）。入場料は大人1000円（11月23日から）。", l:[["予約の決まり（琉球新報）","https://ryukyushimpo.jp/national/entry-5550312.html"]]},
   {t:"予約なしでもOKな所があるよ", b:"正殿の中を除く有料の区域は、予約なしで入れるよ。気軽に寄るならこっちでOK。正殿の外側も予約なしで見られるよ。", l:[["予約の決まり（琉球新報）","https://ryukyushimpo.jp/national/entry-5550312.html"]]},
   {t:"公式をブックマークしとこ", b:"今は正殿の中が人気で、予約がいる形。行きたくなった時のために、「首里城公園 正殿内観覧予約」で調べられるようにしておくとラク。", l:[["予約の決まり（琉球新報）","https://ryukyushimpo.jp/national/entry-5550312.html"]]},
   {t:"話のネタに1つだけ覚えとこ", b:"「焼けてから約7年で、正殿がよみがえった」。全国の職人さんの技で復元されたんだって。だれかとの話のネタにどうぞ。", l:[]}
  ]
 },
 {
  id:"npa-sms", tag:"注意ネタ", date:"2026年11月",
  title:"「警察庁推奨アプリ」を名乗る偽サイトに注意",
  sum:"「NPA（警察庁）」を名乗るSMSで、詐欺対策アプリを入れるよう求め、偽の警察庁のサイトに誘う手口が見つかっている。警察が個人にSMSやメッセージアプリでアプリを入れるよう求めることはない。",
  src:[["INTERNET Watch（トビラシステムズの注意喚起）","https://internet.watch.impress.co.jp/docs/news/2155633.html"],["警察庁「ニセ警察詐欺に注意」","https://www.npa.go.jp/bureau/safetylife/sos47/"]],
  qs:[
   {q:"最近「警察」や「NPA」を名乗るSMSが来た？", yes:1, no:"a:3"},
   {q:"そのSMSのリンクを押した？", yes:2, no:"a:0"},
   {q:"アプリを入れたり、カード番号・パスワード・暗証番号を入れたりした？", yes:"a:2", no:"a:1"}
  ],
  as:[
   {t:"押さずに、そのまま消してOK", b:"警察がSMSでアプリを入れてと言うことはないよ。リンクは押さずにメッセージを消そう。", l:[["警察庁「ニセ警察詐欺に注意」","https://www.npa.go.jp/bureau/safetylife/sos47/"]]},
   {t:"何も入れてなければ、閉じて消そう", b:"ページを開いただけで何も入れていなければ、閉じてSMSを消そう。不安なら警察の相談電話「#9110」に相談できるよ。", l:[["警察庁「ニセ警察詐欺に注意」","https://www.npa.go.jp/bureau/safetylife/sos47/"]]},
   {t:"今すぐ相談して！", b:"カード会社・銀行にすぐ連絡して止めてもらおう。入れたパスワードは変えて、入れたアプリは消す。そのうえで警察の相談電話「#9110」か、近くの警察署に相談してね。", l:[["警察庁「ニセ警察詐欺に注意」","https://www.npa.go.jp/bureau/safetylife/sos47/"]]},
   {t:"家族に1言だけ伝えよ", b:"「警察はSMSでアプリを入れてとは言わないよ」。これを親や家族に伝えておくだけで、だまされにくくなるよ。", l:[]}
  ]
 }
];
var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function url(n){return location.origin+location.pathname+'?n='+n.id}
function go(st,push){var u=location.pathname+(st.v==='list'?'':'?n='+st.id);if(push)history.pushState(st,'',u);else history.replaceState(st,'',u);render(st)}
function render(st){if(!st||st.v==='list')return drawList();var n=find(st.id);if(!n)return drawList();if(st.v==='q')return drawAsk(n,st.i,st.k);if(st.v==='a')return drawAnswer(n,st.j)}
window.addEventListener('popstate',function(e){render(e.state||{v:'list'});window.scrollTo(0,0)});
function list(){go({v:'list'},true);window.scrollTo(0,0)}
function drawList(){
 app.innerHTML=NEWS.map(function(n){return '<div class="card"><span class="tag">'+esc(n.tag)+'</span><span class="date">'+esc(n.date)+'</span><h2>'+esc(n.title)+'</h2><p class="sum">'+esc(n.sum)+'</p><button class="go" onclick="start(\''+n.id+'\')">はい・いいえで答える</button></div>'}).join('');
}
function find(id){for(var i=0;i<NEWS.length;i++)if(NEWS[i].id===id)return NEWS[i]}
function head(n){return '<span class="tag">'+esc(n.tag)+'</span><h2>'+esc(n.title)+'</h2><p class="sum">'+esc(n.sum)+'</p><p class="src">出どころ：'+n.src.map(function(s){return '<a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[0])+'</a>'}).join('／')+'（'+esc(n.date)+'）</p>'}
function start(id){var n=find(id);if(!n)return list();try{gtag('event','news_start',{news_id:id});}catch(e){}go({v:'q',id:id,i:0,k:1},true);window.scrollTo(0,0)}
function next(id,v,k){var n=find(id);if(typeof v==='string'&&v.indexOf('a:')===0)return answer(n,+v.slice(2));go({v:'q',id:id,i:v,k:k+1},true);window.scrollTo(0,0)}
function drawAsk(n,i,k){var q=n.qs[i];
 app.innerHTML='<div class="card">'+head(n)+'</div><div class="card"><p class="step">しつもん '+k+'</p><p class="q">'+esc(q.q)+'</p><div class="btns"><button class="yes" onclick="next(\''+n.id+'\','+JSON.stringify(q.yes).replace(/"/g,"&quot;")+','+k+')">はい</button><button class="no" onclick="next(\''+n.id+'\','+JSON.stringify(q.no).replace(/"/g,"&quot;")+','+k+')">いいえ</button></div><button class="back" onclick="list()">ほかのニュースを見る</button></div>';}
function answer(n,j){try{gtag('event','news_answer',{news_id:n.id,answer_no:j});}catch(e){}go({v:'a',id:n.id,j:j},true);window.scrollTo(0,0)}
function drawAnswer(n,j){var a=n.as[j];var u=encodeURIComponent(url(n)+'&utm_source=share');var tx=encodeURIComponent('「'+n.title+'」にYES/NOで答えたら、今やることがわかった #ネタぴよニュース #ニュース');
 app.innerHTML='<div class="card">'+head(n)+'</div><div class="card"><p class="step">あなたが今やること</p><div class="ans"><b>'+esc(a.t)+'</b>'+esc(a.b)+'</div>'+(a.l.length?'<div class="links">'+a.l.map(function(l){return '▶ <a href="'+l[1]+'" target="_blank" rel="noopener">'+esc(l[0])+'</a>'}).join('<br>')+'</div>':'')+'<div class="row"><a href="https://x.com/intent/post?text='+tx+'&url='+u+'" target="_blank" rel="noopener">Xでシェア</a><a href="https://social-plugins.line.me/lineit/share?url='+u+'" target="_blank" rel="noopener">LINEで送る</a></div><div class="row"><button onclick="start(\''+n.id+'\')">もう一回</button><button onclick="list()">ほかのニュース</button></div></div>';window.scrollTo(0,0)}
var p=new URLSearchParams(location.search).get('n');if(p&&find(p)){history.replaceState({v:'list'},'',location.pathname);go({v:'q',id:p,i:0,k:1},true)}else go({v:'list'},false);
</script>
</body>
